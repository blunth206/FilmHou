<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>光影收藏馆 · 全球影视收藏推荐工作台</title>
<!-- 本工作台通过 WorkBuddy「资料库」skill 搭建、存储和部署 -->
<style>
  :root{
    --bg:#0b0b11; --bg2:#14141d; --panel:#181822; --panel2:#1f1f2b;
    --ink:#ecebf2; --muted:#9a9aae; --line:#2a2a38;
    --red:#e50914; --red2:#b30710;
    --imdb:#f5c518; --tomato:#ff5436; --douban:#2ecc71;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%}
  body{
    background:radial-gradient(120% 80% at 50% -10%, #1a1a26 0%, var(--bg) 60%);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    overflow:hidden;
  }
  .app{display:flex;flex-direction:column;height:100vh;height:100dvh}
  header{
    flex:0 0 auto;display:flex;align-items:center;gap:10px;
    padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));
    background:linear-gradient(180deg,rgba(20,20,29,.96),rgba(20,20,29,.82));
    border-bottom:1px solid var(--line);backdrop-filter:blur(8px);z-index:20;
  }
  .brand{display:flex;align-items:center;gap:9px;min-width:0}
  .brand .logo{width:26px;height:26px;border-radius:7px;flex:0 0 auto;
    background:linear-gradient(135deg,var(--red),#7a0510);display:grid;place-items:center;
    box-shadow:0 0 14px rgba(229,9,20,.5)}
  .brand .logo svg{width:16px;height:16px}
  .brand h1{font-size:15px;margin:0;font-weight:700;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand .sub{font-size:10px;color:var(--muted);font-weight:500}
  .spacer{flex:1 1 auto}
  .sync{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);
    padding:5px 9px;border:1px solid var(--line);border-radius:20px;background:var(--panel)}
  .sync .dot{width:7px;height:7px;border-radius:50%;background:var(--douban);box-shadow:0 0 6px var(--douban)}
  .sync.off .dot{background:#888;box-shadow:none}
  .sync.busy .dot{background:var(--imdb);box-shadow:0 0 6px var(--imdb);animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.35}}
  .add-btn{flex:0 0 auto;width:40px;height:40px;border-radius:12px;border:none;cursor:pointer;
    background:linear-gradient(135deg,var(--red),var(--red2));color:#fff;font-size:24px;line-height:1;
    display:grid;place-items:center;box-shadow:0 4px 14px rgba(229,9,20,.45)}
  .add-btn:active{transform:scale(.94)}

  nav{flex:0 0 auto;display:flex;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line);
    background:rgba(15,15,22,.7);overflow-x:auto;scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  nav button{
    flex:0 0 auto;border:1px solid var(--line);background:var(--panel);color:var(--muted);
    padding:8px 16px;border-radius:22px;font-size:13px;font-weight:600;cursor:pointer;transition:.18s;white-space:nowrap}
  nav button.active{background:linear-gradient(135deg,var(--red),var(--red2));color:#fff;border-color:transparent;box-shadow:0 3px 12px rgba(229,9,20,.4)}

  #deck{flex:1 1 auto;position:relative;overflow:hidden}
  .screen{position:absolute;inset:0;display:none;overflow-y:auto;padding:16px;padding-bottom:max(28px,env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
  .screen.active{display:block}
  .screen h2{font-size:19px;margin:2px 0 4px;font-weight:800;letter-spacing:.5px}
  .screen .desc{color:var(--muted);font-size:12px;margin:0 0 14px}

  /* poster */
  .poster{
    position:relative;border-radius:18px;padding:20px;min-height:300px;display:flex;flex-direction:column;justify-content:space-between;
    color:#fff;overflow:hidden;box-shadow:0 14px 40px rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.06)}
  .poster::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 70% at 80% 0%,rgba(255,255,255,.10),transparent 55%),linear-gradient(0deg,rgba(0,0,0,.55),transparent 40%)}
  .poster .stripe{position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--red);box-shadow:0 0 16px var(--red)}
  .poster .title{position:relative;z-index:2;font-size:30px;font-weight:900;line-height:1.1;letter-spacing:1px;text-shadow:0 3px 10px rgba(0,0,0,.6);word-break:break-word}
  .poster .meta{position:relative;z-index:2;font-size:13px;opacity:.92;margin-top:8px}
  .poster .body{position:relative;z-index:2;margin-top:14px}
  .poster .foot{position:relative;z-index:2;margin-top:14px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}

  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:10px;font-size:12px;font-weight:700;background:rgba(0,0,0,.42);border:1px solid rgba(255,255,255,.12)}
  .chip .k{font-size:10px;opacity:.8;font-weight:600}
  .chip.imdb{color:var(--imdb)} .chip.tomato{color:var(--tomato)} .chip.douban{color:var(--douban)}

  .btn{cursor:pointer;border:none;border-radius:12px;padding:11px 16px;font-size:14px;font-weight:700;transition:.15s;font-family:inherit}
  .btn:active{transform:scale(.96)}
  .btn.primary{background:linear-gradient(135deg,var(--red),var(--red2));color:#fff;box-shadow:0 4px 14px rgba(229,9,20,.4)}
  .btn.ghost{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.18)}
  .btn.sm{padding:8px 12px;font-size:12px;border-radius:10px}
  .btn[disabled]{opacity:.5;cursor:not-allowed}

  /* discover */
  .disc-wrap{display:flex;flex-direction:column;gap:14px}
  .disc-nav{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .disc-nav .arrows{display:flex;gap:8px}
  .disc-nav .arrows button{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:18px;cursor:pointer}
  .dots{display:flex;gap:6px;justify-content:center;margin-top:4px}
  .dots i{width:8px;height:8px;border-radius:50%;background:var(--line);transition:.2s}
  .dots i.on{background:var(--red);width:20px;border-radius:5px}

  /* collection grid */
  .capsule{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:4px;gap:3px;margin-bottom:12px}
  .capsule button{border:none;background:transparent;color:var(--muted);padding:7px 16px;border-radius:18px;font-size:13px;font-weight:700;cursor:pointer}
  .capsule button.on{background:linear-gradient(135deg,var(--red),var(--red2));color:#fff}
  .toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
  .coll-scroll{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 18px;scroll-snap-type:x proximity;scrollbar-width:none}
  .coll-scroll::-webkit-scrollbar{display:none}
  .coll-card{flex:0 0 78%;max-width:340px;scroll-snap-align:center}
  .badge{display:inline-block;font-size:10px;font-weight:700;padding:3px 8px;border-radius:8px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2)}
  .badge.fam{background:rgba(229,9,20,.25);border-color:rgba(229,9,20,.5)}
  .toggles{display:flex;gap:6px;margin-top:10px}
  .toggle{flex:1;border:1px solid rgba(255,255,255,.18);background:rgba(0,0,0,.3);color:#fff;border-radius:10px;padding:8px 4px;font-size:12px;font-weight:700;cursor:pointer;text-align:center;transition:.15s}
  .toggle.on{background:linear-gradient(135deg,var(--red),var(--red2));border-color:transparent;box-shadow:0 3px 10px rgba(229,9,20,.4)}
  .toggle.hate.on{background:linear-gradient(135deg,#444,#222)}

  /* critics */
  .critic{margin-bottom:18px}
  .critic-head{display:flex;align-items:center;gap:12px;margin-bottom:10px}
  .critic-avatar{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:20px;font-weight:900;color:#fff;flex:0 0 auto}
  .critic-meta{font-size:12px;color:var(--muted)}
  .critic-meta b{color:var(--ink);font-size:15px}
  .critic-list{display:flex;flex-direction:column;gap:7px}
  .critic-row{display:flex;align-items:center;justify-content:space-between;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
  .critic-row .cname{font-size:14px;font-weight:600}
  .critic-row .cscore{font-size:18px;font-weight:900;color:var(--imdb)}
  .critic-row .cmeta{font-size:11px;color:var(--muted)}

  /* stats */
  .stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:18px}
  .stat{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:16px;padding:16px}
  .stat .v{font-size:30px;font-weight:900;line-height:1}
  .stat .l{font-size:12px;color:var(--muted);margin-top:6px}
  .stat.red .v{color:var(--red)} .stat.gold .v{color:var(--imdb)} .stat.green .v{color:var(--douban)}
  .chart-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px}
  .chart-card h3{margin:0 0 12px;font-size:14px;font-weight:700}
  .legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;font-size:11px;color:var(--muted)}
  .legend span{display:inline-flex;align-items:center;gap:5px}
  .legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
  .donut-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  .demo-banner{background:rgba(229,9,20,.14);border:1px dashed rgba(229,9,20,.5);color:#ffd9dc;font-size:12px;padding:9px 12px;border-radius:12px;margin-bottom:14px}

  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(4,4,8,.72);backdrop-filter:blur(4px);display:none;z-index:50;align-items:flex-end;justify-content:center}
  .overlay.show{display:flex}
  .sheet{width:100%;max-width:560px;background:var(--bg2);border-radius:22px 22px 0 0;border-top:1px solid var(--line);
    max-height:92vh;overflow-y:auto;padding:18px;padding-bottom:max(20px,env(safe-area-inset-bottom));animation:rise .25s ease}
  @keyframes rise{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
  .sheet h3{margin:0 0 14px;font-size:17px;display:flex;align-items:center;justify-content:space-between}
  .sheet .x{border:none;background:var(--panel);color:var(--muted);width:30px;height:30px;border-radius:9px;font-size:16px;cursor:pointer}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  .field{display:flex;flex-direction:column;gap:5px}
  .field.full{grid-column:1 / -1}
  .field label{font-size:12px;color:var(--muted);font-weight:600}
  .field input,.field select,.field textarea{
    background:var(--panel);border:1px solid var(--line);border-radius:11px;color:var(--ink);
    padding:11px 12px;font-size:16px;font-family:inherit;width:100%}
  .field textarea{resize:vertical;min-height:58px}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--red)}
  .checks{display:flex;gap:8px;flex-wrap:wrap;grid-column:1/-1}
  .check{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:9px 12px;font-size:13px;cursor:pointer}
  .check input{width:18px;height:18px;accent-color:var(--red)}
  .critic-scores{grid-column:1/-1;display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
  .critic-scores .field label{font-size:11px}
  .critic-scores .field input{padding:9px;font-size:14px;text-align:center}
  .sheet .actions{display:flex;gap:10px;margin-top:16px}
  .sheet .actions .btn{flex:1}

  .search-overlay .sheet{border-radius:22px;max-width:560px}
  .search-box{display:flex;gap:10px;margin-bottom:14px}
  .search-box input{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:12px;color:var(--ink);padding:12px 14px;font-size:16px}
  .result-count{font-size:12px;color:var(--muted);margin-bottom:10px}

  .toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);
    background:#222;border:1px solid var(--line);color:#fff;padding:11px 18px;border-radius:14px;font-size:13px;
    opacity:0;pointer-events:none;transition:.25s;z-index:80;box-shadow:0 8px 24px rgba(0,0,0,.5)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media (max-width:768px){
    .poster .title{font-size:26px}
    .stat-grid{grid-template-columns:repeat(2,1fr)}
    .coll-card{flex-basis:86%}
    .brand .sub{display:none}
    .critic-scores{grid-template-columns:repeat(3,1fr)}
  }
  @media (max-width:640px){
    .stat-grid{grid-template-columns:1fr}
  }
  @media (min-width:900px){
    .screen{padding:26px 40px}
    .coll-card{flex-basis:300px}
    .stat-grid{grid-template-columns:repeat(5,1fr)}
  }
/* THEME:BEGIN */
/* 三档面板主题 · 浅 / 灰 / 黑
   卡片统一色 = 主题底色 --bg 向白提亮 30%；全站只用 1 个彩色相（影院红）+ 中性灰阶。
   浅色档例外：底色本身已接近白，再按 30% 混白会看不出层次，因此底色取偏白、
   卡片直接封顶到纯白 #ffffff，靠 1px 描边 + 轻阴影分层（视觉上的「偏白」优先）。 */
body[data-theme="light"]{
  --bg:#f4f4f2; --bg2:#ececea; --panel:#fafaf8; --panel2:#fdfdfb;
  --card:#ffffff;              /* 纯白卡：比偏白底色更亮，浅色档上限 */
  --ink:#17171a; --muted:#5c5c60; --line:#d6d6d3;
  --accent:#a52d26; --on-accent:#ffffff; --accent-soft:rgba(165,45,38,.08);
  --shadow:0 6px 18px rgba(0,0,0,.10);
}
body[data-theme="light"] .card,body[data-theme="light"] .film-card,
body[data-theme="light"] .director-card,body[data-theme="light"] .scene-card,
body[data-theme="light"] .stat,body[data-theme="light"] .chart-card,
body[data-theme="light"] .minicard,body[data-theme="light"] .addcard,
body[data-theme="light"] .poster,body[data-theme="light"] .critic-row{
  box-shadow:var(--shadow)!important}
body[data-theme="grey"]{
  --bg:#8b8b89; --bg2:#838381; --panel:#9b9b98; --panel2:#a3a3a0;
  --card:#aeaeac;              /* #8b8b89 混入 30% 白 */
  --ink:#17171a; --muted:#3e3e42; --line:#6f6f6d;
  --accent:#a32f28; --on-accent:#ffffff; --accent-soft:rgba(163,47,40,.14);
  --shadow:0 8px 22px rgba(0,0,0,.22);
}
body[data-theme="dark"]{
  --bg:#0d0d14; --bg2:#14141d; --panel:#20202c; --panel2:#262633;
  --card:#56565b;              /* #0d0d14 混入 30% 白 */
  --ink:#f5f5f8; --muted:#d8d8e0; --line:#6d6d78;
  --accent:#ff8f87; --on-accent:#1a1a1e; --accent-soft:rgba(255,143,135,.16);
  --shadow:0 8px 22px rgba(0,0,0,.45);
}
/* 把外壳里原有的 7 个彩色变量全部收敛：只留强调红 + 灰阶；
   同一处再给一份黑色主题兜底，避免主题脚本执行前变量未定义造成闪屏 */
:root{
  --bg:#0d0d14; --bg2:#14141d; --panel:#20202c; --panel2:#262633;
  --card:#56565b; --ink:#f5f5f8; --muted:#d8d8e0; --line:#6d6d78;
  --accent:#ff8f87; --on-accent:#1a1a1e; --accent-soft:rgba(255,143,135,.16);
  --shadow:0 8px 22px rgba(0,0,0,.45);
  --red:var(--accent); --red2:var(--accent);
  --imdb:var(--accent); --tomato:var(--accent);
  --douban:var(--muted); --blue:var(--muted); --purple:var(--muted);
}
body{background:var(--bg)!important;color:var(--ink)!important;background-image:none!important}
header{background:var(--panel)!important;border-bottom:1px solid var(--line)!important}
nav{background:var(--bg2)!important}
.brand .logo{background:var(--accent)!important;box-shadow:none!important;background-image:none!important}
.brand .logo svg path{stroke:var(--on-accent)!important;fill:none}
.brand .logo svg path+path{fill:var(--on-accent)!important}
.sheet{background:var(--bg2)!important;color:var(--ink)!important}
.overlay{background:rgba(0,0,0,.56)!important}
.toast{background:var(--panel)!important;color:var(--ink)!important;border-color:var(--line)!important;box-shadow:var(--shadow)!important}
.bottombar{background:var(--panel)!important;border-color:var(--line)!important;color:var(--muted)!important;box-shadow:var(--shadow)!important}
.bottombar button,.btn.ghost,.btn.link,.sheet .x,.pill,.scene-grid button,
.shotlinks button,.toplink,.sync{background:var(--panel)!important;color:var(--ink)!important;border-color:var(--line)!important;box-shadow:none!important;background-image:none!important}
.btn.primary,.pill.on,.pill.fav.on,nav button.active,.add-btn,
.capsule button.on,.toggle.on{
  background:var(--accent)!important;color:var(--on-accent)!important;border-color:transparent!important;
  box-shadow:none!important;background-image:none!important}
.toggle.hate.on{background:var(--muted)!important;color:var(--panel)!important;background-image:none!important}
.searchbar input,.field input,.field select,.field textarea,.search-box input{
  background:var(--panel)!important;color:var(--ink)!important;border-color:var(--line)!important}
.searchbar input:focus,.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)!important}
/* ===== 内部所有卡片：同一底色 = 主题底色混入 30% 白（亮 30%） ===== */
.card,.scene-card,.stat,.chart-card,.vrow,.minicard,.cell,.film-card,.director-card,
.redline,.callout,.scope,.empty,.prow pre,.params span,.chip,.tag,.lv,
.critic-row,.poster,.badge,.coll-card,.addcard{
  background:var(--card)!important;border:1px solid var(--line)!important;color:var(--ink)!important;
  box-shadow:none!important;background-image:none!important}
.addcard{border-radius:16px;min-height:172px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:6px;cursor:pointer;
  font-size:13px;font-weight:700;text-align:center;padding:12px}
.film-grid .addcard,.director-grid .addcard{min-height:126px}
.addcard{border:2px dashed var(--line)!important}
.addcard:hover{background:var(--accent-soft)!important;border-color:var(--accent)!important;color:var(--ink)!important}
.card:hover,.scene-card:hover,.film-card:hover,.director-card:hover{border-color:var(--accent)!important;box-shadow:var(--shadow)!important}
.film-card::after{display:none!important}
.film-card .t,.film-card .m,.film-card .chips{color:var(--ink)!important}
.film-card .m{opacity:.78}
/* 卡片内部的小卡/标签同样只用卡片色，靠 1px 描边分层，不再另起白色 */
.chip,.tag,.chip.imdb,.chip.tomato,.chip.douban,.lv,.prow pre,.params span,
.director-card .wk,.badge,.critic-row{
  color:var(--ink)!important;background:var(--card)!important;border-color:var(--line)!important;opacity:1}
.tag.g{color:var(--on-accent)!important;background:var(--accent)!important;border-color:transparent!important}
.tag.risk-low,.tag.risk-mid,.tag.risk-high{color:var(--ink)!important;border-color:var(--line)!important}
.star.on{color:var(--accent)!important;text-shadow:none!important}
.card .bar{background:var(--accent)!important}
.sect > h4{color:var(--ink)!important}
.sect > h4::before{background:var(--accent)!important}
.callout{border-left-color:var(--line)!important}
.callout.warn{border-left-color:var(--accent)!important}
.minicard.equiv,.minicard.mention{background:var(--card)!important;border-color:var(--line)!important}
.minicard.equiv .mn::after,.minicard.mention .mn::after{color:var(--muted)!important}
.redline b,.critic-row .cscore{color:var(--accent)!important}
.empty{color:var(--muted)!important;border-style:dashed!important}
.scene-card .n,.scene-card .w,.chart-card h3{color:var(--ink)!important}
/* 收藏馆海报卡：原为随机彩色渐变 + 白字，统一后改为卡片色 + 对比色文字 */
.poster,.poster .title,.poster .meta,.poster .body,.poster .foot,
.poster .btn.ghost,.poster .toggle,.poster .chip,.poster .badge{
  color:var(--ink)!important;text-shadow:none!important}
.poster::after{display:none!important}
.poster .stripe{background:var(--accent)!important;box-shadow:none!important}
.poster .btn.ghost,.poster .toggle,.poster .chip,.poster .badge{
  background:var(--card)!important;border:1px solid var(--line)!important;box-shadow:none!important}
.badge.fam{background:var(--accent-soft)!important;color:var(--ink)!important;border-color:var(--line)!important}

        + '<div class="critic">'
        +   '<div class="critic-head">'
        +     '<div class="critic-avatar" style="background:'+CRITIC_COLORS[ci]+'">'+esc(c.charAt(0))+'</div>'
        +     '<div class="critic-meta"><b>'+esc(c)+'</b><br>点评 '+rated.length+' 部 · 均分 <b style="color:'+CRITIC_COLORS[ci]+'">'+(avg?avg.toFixed(1):"—")+'</b>'
        +       (recent?(' · 最近《'+esc(recent["片名"])+'》 '+num(recent[c])):'')+'</div>'
        +   '</div>'
        +   '<div class="critic-list">'
        +     (ranked.length? ranked.slice(0,6).map(function(r){
              return '<div class="critic-row"><div><div class="cname">'+esc(r["片名"])+'</div><div class="cmeta">'+esc(r["类型"]||"")+' · '+esc(r["年份"]||"")+'</div></div><div class="cscore">'+num(r[c]).toFixed(1)+'</div></div>';
            }).join("") : '<div class="demo-banner">暂无点评数据</div>')
        +   '</div>'
        + '</div>';
    });
    area.innerHTML = html;
  }

  function renderStats(){
    var list = activeCollection();
    var total = list.length;
    var fav = list.filter(function(r){ return r["收藏"]; }).length;
    var watched = list.filter(function(r){ return r["已观影"]; }).length;
    var fam = list.filter(function(r){ return r["观影归属"]==="家庭"; }).length;
    var dbl = list.map(function(r){ return num(r["豆瓣评分"]); }).filter(function(v){ return v!=null; });
    var davg = dbl.length? (dbl.reduce(function(a,b){return a+b;},0)/dbl.length):0;

    var cards = [
      {v:total, l:"馆藏总数", c:""},
      {v:fav, l:"收藏数", c:"red"},
      {v:watched, l:"已看数", c:"gold"},
      {v:fam, l:"家庭观影", c:""},
      {v:(davg?davg.toFixed(1):"—"), l:"豆瓣均分", c:"green"}
    ];
    $("#statGrid").innerHTML = cards.map(function(s){
      return '<div class="stat '+s.c+'" data-sp-bindable="database" data-sp-database-id="YEstMyDQgJGTcZK4xSL4iX"><div class="v">'+s.v+'</div><div class="l">'+s.l+'</div></div>';
    }).join("");

    // 豆瓣分布柱状图
    var buckets = [["<7",function(v){return v<7;}],["7-7.9",function(v){return v>=7&&v<8;}],
      ["8-8.4",function(v){return v>=8&&v<8.5;}],["8.5-8.9",function(v){return v>=8.5&&v<9;}],
      ["9-9.4",function(v){return v>=9&&v<9.5;}],["9.5+",function(v){return v>=9.5;}]];
    var counts = buckets.map(function(b){ return list.filter(function(r){ var v=num(r["豆瓣评分"]); return v!=null && b[1](v); }).length; });
    $("#doubanChart").innerHTML = barChart(buckets.map(function(b){return b[0];}), counts);

    // 观影状态环形图
    var seg = [
      {label:"收藏", value:list.filter(function(r){return r["收藏"];}).length, color:"var(--accent)", op:1},
      {label:"已观影", value:list.filter(function(r){return r["已观影"];}).length, color:"var(--accent)", op:.72},
      {label:"不喜欢", value:list.filter(function(r){return r["不喜欢"];}).length, color:"var(--accent)", op:.46},
      {label:"未标记", value:list.filter(function(r){return !r["收藏"]&&!r["已观影"]&&!r["不喜欢"];}).length, color:"var(--line)", op:1}
    ];
    $("#statusDonut").innerHTML = donut(seg);
  }

  // HTML 柱状图：旧版 SVG 用 preserveAspectRatio="none" 把 viewBox 横向拉伸，
  // 柱子和文字一起被非等比缩放，形状与字都变形；改成常规排版就不会。
  function barChart(labels, values, colors){
    var max = Math.max.apply(null, values.concat([1]));
    return '<div class="barchart">'+labels.map(function(l,i){
      var pct = Math.round(values[i]/max*100);
      return '<div class="barcol"><div class="barnum">'+values[i]+'</div>'
        + '<div class="bartrack"><div class="barfill" style="height:'+pct+'%"></div></div>'
        + '<div class="barlabel">'+esc(l)+'</div></div>';
    }).join("")+'</div>';
  }
  function donut(segments){
    var total = segments.reduce(function(a,s){return a+s.value;},0);
    var r=54, cx=70, cy=70, c=2*Math.PI*r, off=0;
    var parts='';
    segments.forEach(function(s){
      if(s.value>0){
        var frac = s.value/total, len = frac*c;
        parts += '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke-width="22" '
          + 'style="stroke:'+s.color+';opacity:'+(s.op||1)+'" '
          + 'stroke-dasharray="'+len.toFixed(2)+' '+(c-len).toFixed(2)+'" stroke-dashoffset="'+(-off).toFixed(2)+'" '
          + 'transform="rotate(-90 '+cx+' '+cy+')"/>';
        off += len;
      }
    });
    var leg = segments.map(function(s){
      return '<span><i style="background:'+s.color+';opacity:'+(s.op||1)+'"></i>'+esc(s.label)+' '+s.value+'</span>';
    }).join("");
    return '<svg viewBox="0 0 140 140" width="140" height="140">'+parts
      + '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke-width="22" style="stroke:var(--line)"/></svg>'
      + '<div class="legend">'+leg+'</div>';
  }

  // ---------- 写入 ----------
  function toProperties(item){
    var p = {};
    p["片名"] = {text: item["片名"]||""};
    p["类型"] = {select: item["类型"]||"电影"};
    if(num(item["年份"])!=null) p["年份"] = {number:num(item["年份"])};
    if(num(item["IMDb评分"])!=null) p["IMDb评分"] = {number:num(item["IMDb评分"])};
    if(num(item["烂番茄"])!=null) p["烂番茄"] = {number:num(item["烂番茄"])};
    if(num(item["豆瓣评分"])!=null) p["豆瓣评分"] = {number:num(item["豆瓣评分"])};
    p["推荐人"] = {text: item["推荐人"]||""};
    p["观影归属"] = {select: item["观影归属"]||"个人"};
    p["收藏"] = {checkbox: !!item["收藏"]};
    p["已观影"] = {checkbox: !!item["已观影"]};
    p["不喜欢"] = {checkbox: !!item["不喜欢"]};
    p["备注短评"] = {text: item["备注短评"]||""};
    CRITICS.forEach(function(c){ if(num(item[c])!=null) p[c] = {number:num(item[c])}; });
    return p;
  }
  function addFromPick(idx){
    var p = state.picks[idx]; if(!p) return;
    var props = toProperties(p); props["收藏"] = {checkbox:true};
    db.addRecord({databaseId:DATABASE_ID, properties:props})
      .then(function(){ toast("已加入馆藏 🎬"); reloadAll(); })
      .catch(function(e){ console.error(e); toast("加入失败，请重试"); });
  }
  function toggleStatus(i, field){
    var list = filteredCollection();
    var item = list[i]; if(!item) return;
    if(item._demo){
      // 演示数据：先落为真实记录
      var props = toProperties(item); props[field] = {checkbox:true};
      db.addRecord({databaseId:DATABASE_ID, properties:props})
        .then(function(){ toast("已存入真实馆藏"); reloadAll(); })
        .catch(function(e){ console.error(e); toast("操作失败"); });
      return;
    }
    var newVal = !item[field];
    item[field] = newVal; // 乐观回显
    renderCollection();
    db.updateRecord({databaseId:DATABASE_ID, recordId:item._id, properties:makeLeaf(field, newVal)})
      .catch(function(e){ console.error(e); toast("同步失败"); });
  }
  function makeLeaf(field, val){ var o={}; o[field] = (field==="收藏"||field==="已观影"||field==="不喜欢") ? {checkbox:val} : {text:val}; return o; }

  // ---------- 表单（入藏 / 编辑） ----------
  function buildSchemaOptions(schemas){
    schemas.forEach(function(sc){
      (sc.properties||[]).forEach(function(f){
        if((f.type==="select"||f.type==="multi_select") && f.config && f.config.options){
          SCHEMA_OPTIONS[f.name] = {};
          f.config.options.forEach(function(o){ SCHEMA_OPTIONS[f.name][o.text]=o.id; });
        }
      });
    });
  }
  function fillSelects(){
    var t=$("#f-type"), o=$("#f-owner");
    if(SCHEMA_OPTIONS["类型"]){
      Object.keys(SCHEMA_OPTIONS["类型"]).forEach(function(k){ var op=document.createElement("option"); op.value=k; op.textContent=k; t.appendChild(op); });
    }
    if(SCHEMA_OPTIONS["观影归属"]){
      Object.keys(SCHEMA_OPTIONS["观影归属"]).forEach(function(k){ var op=document.createElement("option"); op.value=k; op.textContent=k; o.appendChild(op); });
    }
  }
  function buildCriticScoreInputs(){
    var wrap=$("#criticScores"); wrap.innerHTML="";
    CRITICS.forEach(function(c){
      var d=document.createElement("div"); d.className="field";
      d.innerHTML='<label>'+esc(c)+'</label><input name="'+esc(c)+'" type="number" step="0.1" min="0" max="10" placeholder="0-10">';
      wrap.appendChild(d);
    });
  }
  var FORM_CACHE_KEY = "wb_cinema_form_v1";
  function cacheForm(){
    try{
      var f=$("#filmForm"); var o={};
      ["片名","类型","年份","IMDb评分","烂番茄","豆瓣评分","推荐人","观影归属","备注短评"].forEach(function(n){
        var el=f.querySelector('[name="'+n+'"]'); if(el) o[n]=el.value;
      });
      CRITICS.forEach(function(c){ var el=f.querySelector('[name="'+c+'"]'); if(el) o[c]=el.value; });
      localStorage.setItem(FORM_CACHE_KEY, JSON.stringify(o));
    }catch(e){}
  }
  function restoreForm(){
    try{
      var s=localStorage.getItem(FORM_CACHE_KEY); if(!s) return;
      var o=JSON.parse(s); var f=$("#filmForm");
      Object.keys(o).forEach(function(n){
        var el=f.querySelector('[name="'+n+'"]'); if(el && o[n]!=null) el.value=o[n];
      });
    }catch(e){}
  }
  function clearFormCache(){ try{ localStorage.removeItem(FORM_CACHE_KEY); }catch(e){} }

  function openForm(editItem){
    state.editingId = editItem ? editItem._id : null;
    $("#formTitle").textContent = editItem ? "编辑影片" : "入藏新影片";
    var f=$("#filmForm"); f.reset();
    if(editItem){
      f.querySelector('[name="片名"]').value = editItem["片名"]||"";
      f.querySelector('[name="类型"]').value = editItem["类型"]||"";
      f.querySelector('[name="年份"]').value = editItem["年份"]!=null?editItem["年份"]:"";
      f.querySelector('[name="IMDb评分"]').value = editItem["IMDb评分"]!=null?editItem["IMDb评分"]:"";
      f.querySelector('[name="烂番茄"]').value = editItem["烂番茄"]!=null?editItem["烂番茄"]:"";
      f.querySelector('[name="豆瓣评分"]').value = editItem["豆瓣评分"]!=null?editItem["豆瓣评分"]:"";
      f.querySelector('[name="推荐人"]').value = editItem["推荐人"]||"";
      f.querySelector('[name="观影归属"]').value = editItem["观影归属"]||"";
      f.querySelector('[name="备注短评"]').value = editItem["备注短评"]||"";
      f.querySelector('[name="收藏"]').checked = !!editItem["收藏"];
      f.querySelector('[name="已观影"]').checked = !!editItem["已观影"];
      f.querySelector('[name="不喜欢"]').checked = !!editItem["不喜欢"];
      CRITICS.forEach(function(c){ var el=f.querySelector('[name="'+c+'"]'); if(el) el.value = editItem[c]!=null?editItem[c]:""; });
    } else {
      restoreForm();
    }
    showOverlay("#formOverlay");
  }
  function submitForm(e){
    e.preventDefault();
    var f=$("#filmForm");
    var item = {
      "片名": f.querySelector('[name="片名"]').value.trim(),
      "类型": f.querySelector('[name="类型"]').value,
      "年份": f.querySelector('[name="年份"]').value,
      "IMDb评分": f.querySelector('[name="IMDb评分"]').value,
      "烂番茄": f.querySelector('[name="烂番茄"]').value,
      "豆瓣评分": f.querySelector('[name="豆瓣评分"]').value,
      "推荐人": f.querySelector('[name="推荐人"]').value.trim(),
      "观影归属": f.querySelector('[name="观影归属"]').value,
      "备注短评": f.querySelector('[name="备注短评"]').value.trim(),
      "收藏": f.querySelector('[name="收藏"]').checked,
      "已观影": f.querySelector('[name="已观影"]').checked,
      "不喜欢": f.querySelector('[name="不喜欢"]').checked
    };
    CRITICS.forEach(function(c){ item[c] = f.querySelector('[name="'+c+'"]').value; });
    if(!item["片名"]){ toast("请填写片名"); return; }
    var btn=$("#formSubmit"); btn.disabled=true; btn.textContent="保存中…";
    var props = toProperties(item);
    var p;
    if(state.editingId){
      p = db.updateRecord({databaseId:DATABASE_ID, recordId:state.editingId, properties:props});
    } else {
      p = db.addRecord({databaseId:DATABASE_ID, properties:props});
    }
    p.then(function(){
      btn.disabled=false; btn.textContent="保存到馆藏";
      hideOverlay("#formOverlay"); clearFormCache();
      toast(state.editingId?"已更新 ✅":"已入藏 🎬"); reloadAll();
    }).catch(function(err){
      console.error(err); btn.disabled=false; btn.textContent="保存到馆藏"; toast("保存失败，请重试");
    });
  }

  // ---------- 检索 ----------
  function openSearch(){
    $("#searchInput").value = state.search;
    showOverlay("#searchOverlay");
    setTimeout(function(){ $("#searchInput").focus(); }, 200);
    renderSearch();
  }
  function renderSearch(){
    var q = $("#searchInput").value.trim();
    state.search = q;
    var list = filteredCollection();
    $("#searchCount").textContent = q? ("匹配 "+list.length+" 部") : ("全部 "+list.length+" 部");
    var html = list.slice(0,40).map(function(r){
      return '<div class="critic-row"><div><div class="cname">'+esc(r["片名"])+'</div><div class="cmeta">'+esc(r["类型"]||"")+' · '+esc(r["年份"]||"")+' · '+esc(r["观影归属"]||"")+(r["推荐人"]?(" · "+esc(r["推荐人"])):"")+'</div></div>'
        + '<button class="btn ghost sm" data-action="coll-edit" data-i="'+list.indexOf(r)+'">编辑</button></div>';
    }).join("");
    $("#searchResults").innerHTML = html || '<div class="demo-banner">无匹配结果</div>';
  }

  // ---------- 同步指示器 ----------
  function setSync(mode){
    var el=$("#sync"); var t=$("#syncText");
    el.classList.remove("off","busy");
    if(mode==="busy"){ el.classList.add("busy"); t.textContent="同步中"; }
    else if(mode==="off"){ el.classList.add("off"); t.textContent="离线模式"; }
    else { t.textContent="已同步"; }
  }
  function reloadAll(){
    if(!db) return;
    setSync("busy");
    Promise.all([loadCollectionAll(), loadPoolAll()]).then(function(pair){
      state.collection = pair[0]; state.pool = pair[1];
      rebuildNames(); genPicks(); renderAll(); setSync("已同步");
    }).catch(function(e){ console.error(e); setSync("off"); renderAll(); });
  }

  // ---------- 导航 / 滑动 ----------
  function goScreen(name){
    var screens=document.querySelectorAll(".screen");
    screens.forEach(function(s){ s.classList.toggle("active", s.getAttribute("data-screen")===name); });
    var btns=document.querySelectorAll("#nav button");
    btns.forEach(function(b){ b.classList.toggle("active", b.getAttribute("data-screen")===name); });
    var idx=["discover","collection","critics","stats"].indexOf(name);
    if(idx>-1) state._screenIdx=idx;
  }
  function setupSwipe(){
    var deck=$("#deck"), startX=0,startY=0,sx=0,sy=0,target=null;
    deck.addEventListener("touchstart",function(e){
      var t=e.touches[0]; startX=t.clientX; startY=t.clientY; target=e.target; sx=startX; sy=startY;
    },{passive:true});
    deck.addEventListener("touchend",function(e){
      var t=e.changedTouches[0]; var dx=t.clientX-startX, dy=t.clientY-startY;
      if(Math.abs(dx)<55 || Math.abs(dy)>60) return;
      // 若起手在海报轮播内，交给轮播自身的横向滚动，不切换模块
      if(target && target.closest && target.closest("[data-carousel]")) return;
      var names=["discover","collection","critics","stats"];
      var cur=state._screenIdx||0;
      var next = dx<0 ? Math.min(names.length-1, cur+1) : Math.max(0, cur-1);
      if(next!==cur) goScreen(names[next]);
    },{passive:true});
  }

  // ---------- 事件委托 ----------
  function showOverlay(sel){ $(sel).classList.add("show"); }
  function hideOverlay(sel){ $(sel).classList.remove("show"); }
  var toastTimer=null;
  function toast(msg){
    var el=$("#toast"); el.textContent=msg; el.classList.add("show");
    clearTimeout(toastTimer); toastTimer=setTimeout(function(){ el.classList.remove("show"); }, 1800);
  }

  document.addEventListener("click", function(e){
    var el=e.target.closest ? e.target.closest("[data-action]") : null;
    if(!el) return;
    var a=el.getAttribute("data-action");
    if(a==="nav"){ goScreen(el.getAttribute("data-screen")); }
    else if(a==="open-form"){ openForm(null); }
    else if(a==="close-form"){ hideOverlay("#formOverlay"); }
    else if(a==="discover-add"){ addFromPick(parseInt(el.getAttribute("data-index"),10)); }
    else if(a==="discover-prev"){ if(state.picks.length){ state.discoverIdx=(state.discoverIdx-1+state.picks.length)%state.picks.length; renderDiscover(); } }
    else if(a==="discover-next"){ if(state.picks.length){ state.discoverIdx=(state.discoverIdx+1)%state.picks.length; renderDiscover(); } }
    else if(a==="discover-shuffle"){ genPicks(); state.discoverIdx=0; renderDiscover(); toast("已换一批甄选"); }
    else if(a==="filter"){ state.filter=el.getAttribute("data-v"); var caps=document.querySelectorAll("#capsule button"); caps.forEach(function(b){ b.classList.toggle("on", b.getAttribute("data-v")===state.filter); }); renderCollection(); }
    else if(a==="coll-toggle"){ toggleStatus(parseInt(el.getAttribute("data-i"),10), el.getAttribute("data-field")); }
    else if(a==="coll-edit"){ var i=parseInt(el.getAttribute("data-i"),10); var list=filteredCollection(); var item=list[i]; if(item) openForm(item); }
    else if(a==="open-search"){ openSearch(); }
    else if(a==="close-search"){ hideOverlay("#searchOverlay"); state.search=""; renderCollection(); }
  });
  document.addEventListener("input", function(e){
    if(e.target && e.target.id==="searchInput"){ renderSearch(); }
    if(e.target && e.target.closest && e.target.closest("#filmForm")){ cacheForm(); }
  });
  document.addEventListener("submit", function(e){ if(e.target && e.target.id==="filmForm"){ submitForm(e); } });

  // ---------- 初始化 ----------
  function init(){
    buildCriticScoreInputs();
    if(!(window.__SMART_PAGE__ && window.__SMART_PAGE__.database)){
      // 非资料库环境：仍用演示数据展示完整效果
      state.collection=[]; state.pool=[]; rebuildNames(); genPicks(); renderAll();
      setSync("off");
      return;
    }
    db = window.__SMART_PAGE__.database;
    Promise.all([db.getSchema({databaseId:DATABASE_ID}), db.getSchema({databaseId:"DpzzFDvLOcs7n4Oz9pnFVx"})])
      .then(function(schemas){
      buildSchemaOptions(schemas); fillSelects();
      return Promise.all([loadCollectionAll(), loadPoolAll()]);
      })
      .then(function(pair){
        state.collection = pair[0]; state.pool = pair[1];
        rebuildNames(); genPicks(); renderAll(); setSync("已同步");
        if(db && typeof db.onUpdated==="function"){
          db.onUpdated(function(payload){
            var ids=(payload&&payload.databaseIds)||[];
            if(ids.indexOf(DB_COLLECTION)>-1 || ids.indexOf(DB_POOL)>-1){
              if(syncTimer) clearTimeout(syncTimer);
              syncTimer=setTimeout(reloadAll, 350);
            }
          });
        }
      })
      .catch(function(err){ console.error("[database] 初始化失败:", err); setSync("off"); renderAll(); });
    setupSwipe();
  }

  if(document.readyState==="loading"){ document.addEventListener("DOMContentLoaded", init); }
  else { init(); }
})();
</script>
<script>/* THEME-JS:BEGIN */
/* 全站共享主题切换：浅 / 灰 / 黑，三个页面共用同一个 localStorage 键 */
(function(){
  var KEY="filmhou_theme_v1", VALID=["light","grey","dark"], LABEL=["浅","灰","黑"];
  var t="dark";
  try{ t=localStorage.getItem(KEY)||"dark"; }catch(e){}
  if(VALID.indexOf(t)<0) t="dark";
  function apply(){
    document.body.setAttribute("data-theme",t);
    var sw=document.querySelector(".theme-switch");
    if(sw) [].forEach.call(sw.querySelectorAll("button[data-t]"),function(b){
      b.classList.toggle("on",b.getAttribute("data-t")===t);
    });
  }
  apply();
  function mount(){
    var h=document.querySelector("header");
    if(!h || h.querySelector(".theme-switch")) return;
    var sw=document.createElement("div");
    sw.className="theme-switch";
    sw.innerHTML='<span class="ts-label">主题</span>'+VALID.map(function(k,i){
      return '<button type="button" data-t="'+k+'" title="'+["浅色面板","灰色面板","黑色面板"][i]+'">'+LABEL[i]+'</button>';
    }).join("");
    var sp=h.querySelector(".spacer");
    if(sp) h.insertBefore(sw,sp); else h.appendChild(sw);
    sw.addEventListener("click",function(e){
      var b=e.target.closest?e.target.closest("button[data-t]"):null;
      if(!b) return;
      t=b.getAttribute("data-t");
      try{ localStorage.setItem(KEY,t); }catch(e2){}
      apply();
    });
    apply();
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",mount); else mount();
})();
/* THEME-JS:END */</script>
